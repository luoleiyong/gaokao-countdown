<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file:; font-src 'self';" />
<title>课堂助手</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="classroom.css" />
</head>
<body data-skin="board">
<!-- 窗口最上方拖动区：全屏模式顶栏隐藏时仍然可拖 -->
<div class="cls-dragbar" aria-hidden="true"></div>
<div class="cls">
  <!-- 与课堂计时完全一致的整窗背景：自定义图片/视频 + 液态玻璃 + 皮肤遮罩 -->
  <div class="cls-liquid" aria-hidden="true">
    <img class="timer-bg__media" id="clsBgImg" alt="" hidden />
    <video class="timer-bg__media" id="clsBgVideo" muted playsinline loop preload="auto" hidden></video>
    <div class="timer-bg__liquid">
      <i class="timer-blob timer-blob--a"></i>
      <i class="timer-blob timer-blob--b"></i>
      <i class="timer-blob timer-blob--c"></i>
      <i class="timer-shine"></i>
    </div>
    <div class="timer-bg__veil"></div>
  </div>
  <header class="cls-top">
    <button class="cls-back timer-glass" id="btnBackHome" title="返回主界面">‹ 返回</button>
    <div class="cls-brand">
      <span class="cls-seal">课</span>
      <span class="cls-brand__text">
        <b>课堂助手</b>
        <i>随机点名 · 分组 · 计时</i>
      </span>
    </div>
    <nav class="cls-tabs timer-glass">
      <button class="cls-tab on" data-tab="roll">随机点名</button>
      <button class="cls-tab" data-tab="group">随机分组</button>
      <button class="cls-tab" data-tab="timer">课堂计时</button>
    </nav>
    <button class="cls-full timer-glass" id="btnFull" title="全屏模式（右上角「退出全屏」或 Esc 退出）">全屏</button>
    <button class="bg-picbtn cls-bgpic timer-glass" id="btnClsBg" title="更换背景" aria-label="更换背景">
      <img class="bg-picbtn__img" id="clsBgThumb" alt="" hidden />
      <i class="bg-picbtn__theme" aria-hidden="true"></i>
      <i class="bg-picbtn__mark" aria-hidden="true"></i>
    </button>
  </header>

  <main class="cls-main">
    <!-- 随机点名 -->
    <section class="cls-page cls-roll" id="pageRoll">
      <aside class="roster-pane timer-glass" id="rosterPane">
        <div class="roster-head">
          <span>名单</span>
          <button class="cls-link" id="btnImportRoster">导入</button>
        </div>
        <div class="roster-list" id="rosterList"></div>
        <div class="roster-empty" id="rosterEmpty">
          <b>还没有名单</b>
          <span>点击「导入」或拖拽文件到下方区域</span>
        </div>
        <div class="roster-drop" id="rosterDrop">
          <b>拖拽名单文件到这里</b>
          <span>.txt / .csv / .xlsx / .xls，可一次拖入多个</span>
        </div>
        <button class="cls-ghost roster-new" id="btnNewRoster">＋ 新建空名单</button>
      </aside>

      <section class="roll-stage" id="rollStage">
        <div class="roll-glow" aria-hidden="true"></div>
        <div class="roll-roster" id="rollRoster">未选择名单</div>
        <div class="roll-name" id="rollName"><span>课堂</span><span>点名</span></div>
        <div class="roll-sub" id="rollSub">选择左侧名单，然后开始点名</div>
        <div class="roll-count">
          <span>抽取人数</span>
          <button class="roll-count__btn" id="btnCountMinus" title="减少">−</button>
          <b id="rollCount">1</b>
          <button class="roll-count__btn" id="btnCountPlus" title="增加">＋</button>
        </div>
        <button class="roll-btn" id="btnRoll"><span>开 始 点 名</span></button>
        <div class="roll-toggles">
          <label class="voice-toggle" for="voiceToggle">
            <input type="checkbox" id="voiceToggle" />
            <span class="voice-toggle__dot"></span>
            <span>朗读姓名</span>
          </label>
          <label class="voice-toggle" for="noRepeatToggle" title="一轮内不重复抽到同一个人">
            <input type="checkbox" id="noRepeatToggle" />
            <span class="voice-toggle__dot"></span>
            <span>一轮不重复</span>
          </label>
          <label class="voice-toggle" for="muteToggle" title="开启后点名不朗读姓名">
            <input type="checkbox" id="muteToggle" />
            <span class="voice-toggle__dot"></span>
            <span>静音模式</span>
          </label>
        </div>
        <button class="cls-ghost roll-reset" id="btnResetDraw" title="重置重复与不重复抽取的次数">重置抽取次数</button>
      </section>
    </section>

    <!-- 随机分组 -->
    <section class="cls-page cls-group" id="pageGroup" hidden>
      <div class="group-panel timer-glass">
        <div class="group-controls">
          <div class="group-field">
            <span>分组方式</span>
            <select id="groupMode" class="group-select">
              <option value="count">按组数</option>
              <option value="size">按每组人数</option>
            </select>
          </div>
          <div class="group-stepper">
            <button class="roll-count__btn" id="btnGroupMinus" title="减少">−</button>
            <b id="groupValue">4</b>
            <button class="roll-count__btn" id="btnGroupPlus" title="增加">＋</button>
          </div>
          <button class="cls-primary group-go" id="btnGroupGenerate">随机分组</button>
        </div>
        <div class="group-stage" id="groupResult">
          <p class="group-empty">使用当前名单随机分组，每组人数尽量平均</p>
        </div>
      </div>
    </section>

    <!-- 课堂计时：整窗液态玻璃界面 -->
    <section class="cls-page cls-timer" id="pageTimer" hidden>
      <div class="timer-bg" aria-hidden="true">
        <div class="timer-bg__liquid">
          <i class="timer-blob timer-blob--a"></i>
          <i class="timer-blob timer-blob--b"></i>
          <i class="timer-blob timer-blob--c"></i>
          <i class="timer-shine"></i>
        </div>
        <img class="timer-bg__media" id="timerBgImg" alt="" hidden />
        <video class="timer-bg__media" id="timerBgVideo" muted playsinline loop preload="auto" hidden></video>
        <div class="timer-bg__veil"></div>
      </div>
      <div class="timer-stage timer-card">
        <button class="timer-back timer-glass" id="btnTimerBack">‹ 返回</button>
        <div class="timer-mode timer-glass" id="timerMode">
          <button data-mode="countdown" class="on">倒计时</button>
          <button data-mode="stopwatch">计时器</button>
        </div>
        <div class="timer-clock" id="timerClock">
          <div class="timer-digit-group">
            <div class="timer-digit-col">
              <button data-step="600" aria-label="加十分钟">+</button>
              <b id="timerM1">0</b>
              <button data-step="-600" aria-label="减十分钟">−</button>
            </div>
            <div class="timer-digit-col">
              <button data-step="60" aria-label="加一分钟">+</button>
              <b id="timerM0">5</b>
              <button data-step="-60" aria-label="减一分钟">−</button>
            </div>
          </div>
          <span class="timer-colon">:</span>
          <div class="timer-digit-group">
            <div class="timer-digit-col">
              <button data-step="10" aria-label="加十秒">+</button>
              <b id="timerS1">0</b>
              <button data-step="-10" aria-label="减十秒">−</button>
            </div>
            <div class="timer-digit-col">
              <button data-step="1" aria-label="加一秒">+</button>
              <b id="timerS0">0</b>
              <button data-step="-1" aria-label="减一秒">−</button>
            </div>
          </div>
        </div>
        <div class="timer-fixed timer-glass" id="timerFixed">
          <button data-sec="60">1 分钟</button>
          <button data-sec="180">3 分钟</button>
          <button data-sec="300" class="on">5 分钟</button>
          <button data-sec="600">10 分钟</button>
          <button data-sec="900">15 分钟</button>
        </div>
        <div class="timer-bottom">
          <button class="timer-tool timer-glass" id="btnTimerFull"><i>⛶</i>全屏</button>
          <button class="timer-play" id="btnTimerStart" title="开始计时"></button>
          <button class="timer-tool timer-glass" id="btnTimerReset"><i>↻</i>重置</button>
        </div>
        <div class="timer-full-actions">
          <button class="timer-full-btn is-primary" id="btnTimerPause">暂停</button>
          <button class="timer-full-btn" id="btnTimerExit">退出</button>
        </div>
        <p class="timer-tip" id="timerTip">设置时长后点击开始，3 秒后自动全屏</p>
        <button class="bg-picbtn timer-bg-btn timer-glass" id="btnTimerBg" title="更换背景" aria-label="更换背景">
          <img class="bg-picbtn__img" id="timerBgThumb" alt="" hidden />
          <i class="bg-picbtn__theme" aria-hidden="true"></i>
          <i class="bg-picbtn__mark" aria-hidden="true"></i>
        </button>
      </div>
    </section>
  </main>
</div>

<button class="cls-exitfull timer-glass" id="btnExitFull" hidden>退出全屏</button>

<!-- 外观与背景：液态玻璃参数 + 背景更换合并为同一个面板（点名 / 分组 / 计时共用） -->
<div class="timer-settings timer-glass bg-panel" id="timerBgPanel" hidden>
  <div class="timer-settings__head">
    <b>外观与背景</b>
    <button id="btnTimerBgClose" title="关闭">×</button>
  </div>
  <div class="timer-settings__actions">
    <button class="timer-settings__btn" id="btnTimerBgPick">导入动画 / 图片</button>
  </div>
  <p class="timer-settings__label" id="timerBgListLabel" hidden>已导入背景</p>
  <div class="timer-bg-list" id="timerBgList" hidden></div>
  <p class="timer-settings__label">内置动画</p>
  <div class="timer-bg-list bg-builtin-list" id="timerBgBuiltin"></div>
  <div class="timer-settings__actions">
    <button class="timer-settings__btn timer-bg-opt" data-bg-mode="theme"><i class="bg-swatch" data-swatch="theme"></i>主题</button>
  </div>
  <p class="timer-settings__name" id="timerBgName">当前：主题默认背景</p>

  <p class="timer-settings__label">液态玻璃</p>
  <label class="timer-settings__range">
    <span>界面透明度</span>
    <input id="timerOpacity" type="range" min="20" max="95" value="55" />
    <em id="timerOpacityVal">55%</em>
  </label>
  <label class="timer-settings__range">
    <span>背景遮罩</span>
    <input id="timerVeil" type="range" min="0" max="80" value="25" />
    <em id="timerVeilVal">25%</em>
  </label>
  <label class="timer-settings__range">
    <span>毛玻璃模糊</span>
    <input id="timerBlur" type="range" min="0" max="40" value="18" />
    <em id="timerBlurVal">18px</em>
  </label>

  <p class="timer-settings__label">界面</p>
  <label class="timer-settings__range">
    <span>文字大小</span>
    <input id="lookFont" type="range" min="85" max="140" value="100" step="1" />
    <em id="lookFontVal">100%</em>
  </label>
  <label class="timer-settings__range">
    <span>面板宽度</span>
    <input id="lookWidth" type="range" min="80" max="140" value="100" step="1" />
    <em id="lookWidthVal">100%</em>
  </label>
  <label class="timer-settings__range">
    <span>圆角大小</span>
    <input id="lookRadius" type="range" min="4" max="36" value="18" step="1" />
    <em id="lookRadiusVal">18px</em>
  </label>
  <div class="timer-settings__actions">
    <button class="timer-settings__btn" id="btnLookReset">恢复默认</button>
  </div>
</div>

<input type="file" id="fileRoster" accept=".txt,.csv,.xlsx,.xls" multiple hidden />

<!-- 管理员模式 -->
<div class="cls-modal" id="adminModal" hidden>
  <div class="cls-modal__backdrop" data-close="admin"></div>
  <div class="cls-modal__box cls-admin-box">
    <header class="cls-modal__head">
      <h3 id="adminTitle">管理员模式</h3>
      <button class="win-btn" data-close="admin" title="关闭">×</button>
    </header>
    <div class="cls-admin-body" id="adminBody"></div>
  </div>
</div>

<!-- 课程表已移至首页独立页面 -->

<div class="cls-toast" id="clsToast" hidden></div>
<script src="sound.js"></script>
<script src="classroom.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
<title>课堂助手</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="classroom.css" />
</head>
<body data-skin="board">
<div class="cls">
  <header class="cls-top">
    <button class="cls-back" id="btnBackHome" title="返回主界面">‹ 返回</button>
    <div class="cls-brand">
      <span class="cls-seal">课</span>
      <span class="cls-brand__text">
        <b>课堂助手</b>
        <i>随机点名 · 分组 · 计时</i>
      </span>
    </div>
    <nav class="cls-tabs">
      <button class="cls-tab on" data-tab="roll">随机点名</button>
      <button class="cls-tab" data-tab="group">随机分组</button>
      <button class="cls-tab" data-tab="timer">课堂计时</button>
    </nav>
    <button class="cls-project" id="btnProjection" title="全屏投影模式（Esc 退出）">投影</button>
  </header>

  <main class="cls-main">
    <!-- 随机点名 -->
    <section class="cls-page cls-roll" id="pageRoll">
      <aside class="roster-pane" id="rosterPane">
        <div class="roster-head">
          <span>名单</span>
          <button class="cls-link" id="btnImportRoster">导入</button>
        </div>
        <div class="roster-list" id="rosterList"></div>
        <div class="roster-empty" id="rosterEmpty">
          <b>还没有名单</b>
          <span>点击「导入」或拖拽文件到下方区域</span>
        </div>
        <div class="roster-drop" id="rosterDrop">
          <b>拖拽名单文件到这里</b>
          <span>.txt / .csv / .xlsx / .xls，可一次拖入多个</span>
        </div>
        <button class="cls-ghost roster-new" id="btnNewRoster">＋ 新建空名单</button>
      </aside>

      <section class="roll-stage" id="rollStage">
        <div class="roll-glow" aria-hidden="true"></div>
        <div class="roll-roster" id="rollRoster">未选择名单</div>
        <div class="roll-name" id="rollName"><span>课堂</span><span>点名</span></div>
        <div class="roll-sub" id="rollSub">选择左侧名单，然后开始点名</div>
        <div class="roll-count">
          <span>抽取人数</span>
          <button class="roll-count__btn" id="btnCountMinus" title="减少">−</button>
          <b id="rollCount">1</b>
          <button class="roll-count__btn" id="btnCountPlus" title="增加">＋</button>
        </div>
        <button class="roll-btn" id="btnRoll"><span>开 始 点 名</span></button>
        <div class="roll-toggles">
          <label class="voice-toggle" for="voiceToggle">
            <input type="checkbox" id="voiceToggle" />
            <span class="voice-toggle__dot"></span>
            <span>朗读姓名</span>
          </label>
          <label class="voice-toggle" for="noRepeatToggle" title="一轮内不重复抽到同一个人">
            <input type="checkbox" id="noRepeatToggle" />
            <span class="voice-toggle__dot"></span>
            <span>一轮不重复</span>
          </label>
        </div>
      </section>
    </section>

    <!-- 随机分组 -->
    <section class="cls-page cls-group" id="pageGroup" hidden>
      <div class="group-panel">
        <div class="group-controls">
          <div class="group-field">
            <span>分组方式</span>
            <select id="groupMode" class="group-select">
              <option value="count">按组数</option>
              <option value="size">按每组人数</option>
            </select>
          </div>
          <div class="group-stepper">
            <button class="roll-count__btn" id="btnGroupMinus" title="减少">−</button>
            <b id="groupValue">4</b>
            <button class="roll-count__btn" id="btnGroupPlus" title="增加">＋</button>
          </div>
          <button class="cls-primary group-go" id="btnGroupGenerate">随机分组</button>
        </div>
        <div class="group-stage" id="groupResult">
          <p class="group-empty">使用当前名单随机分组，每组人数尽量平均</p>
        </div>
      </div>
    </section>

    <!-- 课堂计时 -->
    <section class="cls-page cls-timer" id="pageTimer" hidden>
      <div class="timer-panel">
        <div class="timer-display" id="timerDisplay">05:00</div>
        <div class="timer-presets" id="timerPresets">
          <button data-min="1">1 分钟</button>
          <button data-min="3">3 分钟</button>
          <button data-min="5" class="on">5 分钟</button>
          <button data-min="10">10 分钟</button>
          <button data-min="15">15 分钟</button>
        </div>
        <div class="timer-actions">
          <button class="cls-primary" id="btnTimerStart">开始计时</button>
          <button class="cls-ghost" id="btnTimerReset">重置</button>
        </div>
        <p class="timer-tip" id="timerTip">选择时长后点击「开始计时」</p>
      </div>
    </section>
  </main>
</div>

<input type="file" id="fileRoster" accept=".txt,.csv,.xlsx,.xls" multiple hidden />

<!-- 管理员模式 -->
<div class="cls-modal" id="adminModal" hidden>
  <div class="cls-modal__backdrop" data-close="admin"></div>
  <div class="cls-modal__box cls-admin-box">
    <header class="cls-modal__head">
      <h3 id="adminTitle">管理员模式</h3>
      <button class="win-btn" data-close="admin" title="关闭">×</button>
    </header>
    <div class="cls-admin-body" id="adminBody"></div>
  </div>
</div>

<!-- 课程表已移至首页独立页面 -->

<div class="cls-toast" id="clsToast" hidden></div>
<script src="sound.js"></script>
<script src="classroom.js"></script>
</body>
</html>
